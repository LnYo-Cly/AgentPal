services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/relay/relay.Dockerfile
    environment:
      OAP_REDIS_URL: redis://redis:6379
      OAP_REDIS_KEY_PREFIX: agentpal:relay
      OAP_RELAY_REQUIRE_PAIRING: "true"
      RUST_LOG: agentpal_relay=info
    ports:
      - "8790:8790"
    depends_on:
      - redis
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8790"

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
